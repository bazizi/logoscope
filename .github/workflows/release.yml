name: Rust Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          $dir = "release-${{ matrix.target }}"
          # Create a directory for the release files
          New-Item -ItemType Directory -Force -Path $dir
          # Copy the compiled binary into the new directory
          Copy-Item "target/${{ matrix.target }}/release/logoscope.exe" -Destination "$dir/"
          # Zip the directory
          Compress-Archive -Path $dir -DestinationPath "${dir}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.target }}
          path: release-${{ matrix.target }}.zip
          retention-days: 5

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.zip

  publish_pages:
    name: Publish download links to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get release download URLs
        id: get_download_urls
        # This script fetches the download URLs for the release assets.
        run: |
          DOWNLOAD_URL_64=$(curl -sL \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/bazizi/logoscope/releases/tags/${{ github.ref_name }}" | \
            jq -r '.assets[] | select(.name | contains("x86_64")) | .browser_download_url')

          echo "download_url_64=$DOWNLOAD_URL_64" >> $GITHUB_OUTPUT

      - name: Create index.html
        run: |
          # Create the '_site' directory which will be uploaded to GitHub Pages
          mkdir -p _site
          # Generate a simple HTML file with the download links
          echo "<html>" > _site/index.html
          echo "<head><title>Download ${{ github.ref_name }}</title></head>" >> _site/index.html
          echo "<body>" >> _site/index.html
          echo "<h1>Download ${{ github.ref_name }}</h1>" >> _site/index.html
          echo "<h2>Windows Executables</h2>" >> _site/index.html
          echo "<a href=\"${{ steps.get_download_urls.outputs.download_url_64 }}\">Download 64-bit version</a><br>" >> _site/index.html
          echo "</body>" >> _site/index.html
          echo "</html>" >> _site/index.html

      - name: Setup Pages
        # Configures the GitHub Pages environment
        uses: actions/configure-pages@v5

      - name: Upload artifact
        # Uploads the '_site' directory as an artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        # Deploys the uploaded artifact to GitHub Pages
        uses: actions/deploy-pages@v4
