# .gitlab-ci.yml
stages:
  - build
  - deploy

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

# Cache Cargo dependencies
.cargo_cache: &cargo_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/

# Build for Windows x86_64
build-windows:
  stage: build
  image: rust:latest
  <<: *cargo_cache
  before_script:
    - apt-get update && apt-get install -y gcc-mingw-w64-x86-64
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo build --release --target x86_64-pc-windows-gnu
    - mkdir -p binaries/windows
    - cp target/x86_64-pc-windows-gnu/release/*.exe binaries/windows/ || true
    - ls -la binaries/windows/
  artifacts:
    paths:
      - binaries/windows/
    expire_in: 1 hour

# Build for macOS x86_64
build-macos-x64:
  stage: build
  image: rust:latest
  <<: *cargo_cache
  before_script:
    - apt-get update && apt-get install -y clang
    - rustup target add x86_64-apple-darwin
  script:
    - cargo build --release --target x86_64-apple-darwin
    - mkdir -p binaries/macos-x64
    - cp target/x86_64-apple-darwin/release/* binaries/macos-x64/ || true
    - find binaries/macos-x64/ -type f -executable -exec file {} \; | grep -v "text"
  artifacts:
    paths:
      - binaries/macos-x64/
    expire_in: 1 hour

# Build for macOS ARM64 (Apple Silicon)
build-macos-arm64:
  stage: build
  image: rust:latest
  <<: *cargo_cache
  before_script:
    - apt-get update && apt-get install -y clang
    - rustup target add aarch64-apple-darwin
  script:
    - cargo build --release --target aarch64-apple-darwin
    - mkdir -p binaries/macos-arm64
    - cp target/aarch64-apple-darwin/release/* binaries/macos-arm64/ || true
    - find binaries/macos-arm64/ -type f -executable -exec file {} \; | grep -v "text"
  artifacts:
    paths:
      - binaries/macos-arm64/
    expire_in: 1 hour

# Deploy to GitLab Pages
pages:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build-windows
    - build-macos-x64
    - build-macos-arm64
  before_script:
    - apk add --no-cache tree
  script:
    - mkdir -p public/downloads
    - cp -r binaries/* public/downloads/
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
          <title>Rust Binary Downloads</title>
          <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              .download-section { margin: 20px 0; }
              .download-link { 
                  display: inline-block; 
                  padding: 10px 20px; 
                  background: #007cba; 
                  color: white; 
                  text-decoration: none; 
                  border-radius: 5px; 
                  margin: 5px;
              }
              .download-link:hover { background: #005a87; }
          </style>
      </head>
      <body>
          <h1>Rust Binary Downloads</h1>
          <div class="download-section">
              <h2>Windows (x86_64)</h2>
      EOF
    - |
      for file in public/downloads/windows/*; do
        if [ -f "$file" ]; then
          filename=$(basename "$file")
          echo "        <a href=\"downloads/windows/$filename\" class=\"download-link\">$filename</a><br>" >> public/index.html
        fi
      done
    - |
      cat >> public/index.html << 'EOF'
          </div>
          <div class="download-section">
              <h2>macOS (Intel x86_64)</h2>
      EOF
    - |
      for file in public/downloads/macos-x64/*; do
        if [ -f "$file" ]; then
          filename=$(basename "$file")
          echo "        <a href=\"downloads/macos-x64/$filename\" class=\"download-link\">$filename</a><br>" >> public/index.html
        fi
      done
    - |
      cat >> public/index.html << 'EOF'
          </div>
          <div class="download-section">
              <h2>macOS (Apple Silicon ARM64)</h2>
      EOF
    - |
      for file in public/downloads/macos-arm64/*; do
        if [ -f "$file" ]; then
          filename=$(basename "$file")
          echo "        <a href=\"downloads/macos-arm64/$filename\" class=\"download-link\">$filename</a><br>" >> public/index.html
        fi
      done
    - |
      cat >> public/index.html << 'EOF'
          </div>
          <p><em>Built from commit: $CI_COMMIT_SHA</em></p>
      </body>
      </html>
      EOF
    - tree public/
  artifacts:
    paths:
      - public
  only:
    - main

